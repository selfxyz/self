# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: |
  Only report issues that would cause a bug, security vulnerability, data loss,
  or production incident if shipped. Be direct and terse.

  Do NOT report:
  - Nitpicks, style preferences, or "consider doing X" suggestions
  - Missing comments, missing docs, or naming bikeshed
  - Optional improvements or hypothetical future risks
  - Code splitting, lazy loading, or bundle optimization suggestions
  - Missing haptic/analytics assertions in tests
  - Hardcoded values in dev-only or mock/placeholder screens
  - Test mock wiring — only flag tests that assert wrong behavior

  If you are unsure whether an issue is production-critical, do not post it.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main", "dev", "staging"]
  tools:
    github-checks:
      timeout_ms: 300000
  path_instructions:
    - path: "contracts/**/*.sol"
      instructions: |
        Focus exclusively on security vulnerabilities (reentrancy, overflow, access control)
        and correctness bugs. Ignore style, gas optimization suggestions, and missing NatSpec.
    - path: "circuits/**/*.circom"
      instructions: |
        Focus on circuit correctness, constraint soundness, and input validation bugs only.
    - path: "noir/**/*.nr"
      instructions: |
        Focus on constraint correctness, soundness bugs, and public/private input misuse only.
    - path: "app/ios/**/*"
      instructions: |
        Focus on security issues (keychain misuse, insecure storage) and crash-causing bugs only.
    - path: "app/android/**/*"
      instructions: |
        Focus on security issues and crash-causing bugs only.

chat:
  auto_reply: true
