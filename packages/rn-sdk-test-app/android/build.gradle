buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.0.12077973"
        kotlinVersion = "2.0.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.11.2')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        // mavenLocal resolves @selfxyz/rn-sdk's KMP AAR dependency during the
        // PATH-A spike (see specs/projects/sdk/workstreams/webview-in-app/plans/
        // PATH-A-rn-wraps-kmp.html). Remove once SD-06 (SELF-2534) publishes
        // KMP artifacts to a hosted Maven repository.
        mavenLocal()
        google()
        mavenCentral()
        maven {
            // All of React Native (JS, Android binaries) is installed from npm
            url("$rootDir/../../../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../../../node_modules/jsc-android/dist")
        }
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: "com.facebook.react.rootproject"
