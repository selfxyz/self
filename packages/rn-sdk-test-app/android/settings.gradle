}
rootProject.name = 'SelfRNSDKTestApp'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')
includeBuild('../../kmp-sdk') {
  dependencySubstitution {
    substitute module('xyz.self.sdk:shared') using project(':shared')
  }
}
