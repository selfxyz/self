buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['SelfRnSdk_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.4.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion') ?: '1.9.24'}"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['SelfRnSdk_' + name]).toInteger()
}

android {
  namespace 'xyz.self.rnsdk'
  compileSdkVersion getExtOrIntegerDefault('compileSdkVersion') ?: 34

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault('minSdkVersion') ?: 24
    targetSdkVersion getExtOrIntegerDefault('targetSdkVersion') ?: 34
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main {
      java.srcDirs += "src/main/java"
      kotlin.srcDirs += "src/main/java"

      // Deliver the embedded webview-app bundle into the consuming APK's
      // android_asset. The bundle is produced by this package's `copy-assets`
      // step into `assets/self-wallet/` (package.json). Adding the parent
      // `assets/` dir (not `assets/self-wallet/`) as a library asset source
      // means AGP's asset merge places `self-wallet/index.html` at
      // `android_asset/self-wallet/index.html` — the exact URL
      // SelfVerification loads on Android
      // (`file:///android_asset/self-wallet/index.html`). Library assets merge
      // into the host app automatically, so no host-side wiring is required.
      //
      // Guarded so KYC-only builds (which don't run copy-assets and have no
      // bundle) still compile: a missing srcDir would otherwise be a hard
      // asset-merge failure on some AGP versions.
      def selfWalletBundle = file("../assets/self-wallet")
      if (selfWalletBundle.exists()) {
        assets.srcDirs += file("../assets")
      } else {
        logger.warn("[@selfxyz/rn-sdk] assets/self-wallet not found; skipping " +
          "webview bundle asset delivery. Run `pnpm --filter @selfxyz/rn-sdk build` " +
          "to produce it, or ignore for KYC-only builds.")
      }
    }
  }
}

repositories {
  mavenLocal()
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getExtOrDefault('kotlinVersion') ?: '1.9.24'}"
  // KMP bridge wiring is opt-in. compileOnly lets us compile SelfBridgeModule
  // against KMP types without forcing every @selfxyz/rn-sdk consumer to pull
  // the AAR. Consumers that want the bridge enabled add the KMP dep at the
  // host level (e.g. rn-sdk-test-app/android/app/build.gradle), and
  // SelfCryptoPackage gracefully skips SelfBridgeModule registration if
  // the classes aren't present at runtime. Replace with a stable hosted
  // Maven coordinate once SD-06 (SELF-2534) lands.
  // Host-overridable via rootProject ext `selfSharedAndroidVersion` (or -PSelfRnSdk_… ):
  // app/ resolves the in-repo kmp-sdk 0.1.0 from mavenLocal (default), while rn-sdk-test-app
  // sets 0.1.3 to match the self-sdk-native AARs from self-sdk-dist.
  compileOnly "xyz.self.sdk:shared-android:${getExtOrDefault('selfSharedAndroidVersion') ?: '0.1.0'}"
  // Match React Native 0.76.x's pinned coroutines version (1.6.1) to avoid
  // version-constraint conflicts in the consumer's resolution graph.
  compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1"
}
