name: Common CI

on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm
        with:
          cache-version: v1
      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install
      - name: Build dependencies
        run: pnpm --filter @selfxyz/mobile-app run build:deps
      - name: Cache build artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            common/dist
            packages/mobile-sdk-alpha/dist
          key: build-deps-${{ runner.os }}-${{ hashFiles('common/**/*', 'packages/mobile-sdk-alpha/**/*', '!common/dist/**', '!packages/mobile-sdk-alpha/dist/**') }}

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm
        with:
          cache-version: v1
      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install
      - name: Run linter
        run: pnpm --filter @selfxyz/common lint

  type-check:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm
        with:
          cache-version: v1
      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install
      - name: Restore build artifacts
        id: restore-build-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            common/dist
            packages/mobile-sdk-alpha/dist
          key: build-deps-${{ runner.os }}-${{ hashFiles('common/**/*', 'packages/mobile-sdk-alpha/**/*', '!common/dist/**', '!packages/mobile-sdk-alpha/dist/**') }}
          fail-on-cache-miss: false
      - name: Build @selfxyz/common (fallback on cache miss)
        if: steps.restore-build-deps.outputs.cache-hit != 'true'
        run: pnpm --filter @selfxyz/common build
      - name: Build @selfxyz/mobile-sdk-alpha
        run: pnpm --filter @selfxyz/mobile-sdk-alpha build
      - name: Build @selfxyz/qrcode
        run: pnpm --filter @selfxyz/qrcode build:deps
      - name: Run pnpm types
        run: pnpm types

  test-common:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm
        with:
          cache-version: v1
      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install
      - name: Restore build artifacts
        id: restore-build-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            common/dist
            packages/mobile-sdk-alpha/dist
          key: build-deps-${{ runner.os }}-${{ hashFiles('common/**/*', 'packages/mobile-sdk-alpha/**/*', '!common/dist/**', '!packages/mobile-sdk-alpha/dist/**') }}
          fail-on-cache-miss: false
      - name: Build @selfxyz/common (fallback on cache miss)
        if: steps.restore-build-deps.outputs.cache-hit != 'true'
        run: pnpm --filter @selfxyz/common build
      - name: Build @selfxyz/mobile-sdk-alpha
        run: pnpm --filter @selfxyz/mobile-sdk-alpha build
      - name: Run @selfxyz/common tests
        run: pnpm --filter @selfxyz/common test
