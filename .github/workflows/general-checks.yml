name: General Self CI

env:
  GH_CACHE_VERSION: v1
  GH_YARN_CACHE_VERSION: v1

on:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup and Cache Dependencies
        id: setup
        uses: ./.github/actions/setup-and-cache-deps
        with:
          app_path: app
          node_version: '18'
          platform: 'linux'
      - name: Build dependencies
        shell: bash
        run: yarn workspace @selfxyz/common build
      - name: Run linter
        run: yarn lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup and Cache Dependencies
        id: setup
        uses: ./.github/actions/setup-and-cache-deps
        with:
          app_path: app
          node_version: '18'
          platform: 'linux'
      - name: Yarn types
        shell: bash
        run: yarn types

  test-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup and Cache Dependencies
        id: setup
        uses: ./.github/actions/setup-and-cache-deps
        with:
          app_path: app
          node_version: '18'
          platform: 'linux'
      - name: Build dependencies
        shell: bash
        run: yarn workspace @selfxyz/common build
      - name: Run @selfxyz/common tests
        run: yarn workspace @selfxyz/common test
