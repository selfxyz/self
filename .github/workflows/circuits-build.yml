name: Circuits Build
on:
  push:
    branches:
      - main
    paths:
      - "circuits/circuits/**"
      - ".github/workflows/artifacts.yml"
  pull_request:
    branches:
      - main
    paths:
      - "circuits/circuits/**"
      - ".github/workflows/artifacts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ["self-hosted", "selfxyz-org", "ubuntu-22-04", "128ram"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cpp dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libgmp-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Circom binary
        id: circom-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/circom
          key: circom-v2.1.9

      - name: Download Circom Binary v2.1.9
        if: steps.circom-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/circom
          wget -qO ~/.cache/circom/circom https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          chmod +x ~/.cache/circom/circom
          # TODO: Move to environment variable for better security management
          # Verify checksum - SHA256 for circom v2.1.9 linux-amd64
          echo "e5575829252d763b7818049df9de2ef9304df834697de77fa63ce7babc23c967  ~/.cache/circom/circom" | sha256sum -c -

      - name: Save Circom cache
        if: steps.circom-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/circom
          key: circom-v2.1.9

      - name: Install Circom
        run: sudo cp ~/.cache/circom/circom /usr/local/bin/circom

      - name: Install dependencies
        uses: ./.github/actions/yarn-install
        with:
          working_directory: circuits

      - name: Print Circom version
        run: circom --version

      - name: Restore circuits cache
        id: circuits-cache
        uses: actions/cache/restore@v4
        with:
          path: output
          key: circuits-output-v1-${{ hashFiles('circuits/circuits/**', 'circuits/scripts/**', 'circuits/*.{json,yml,yaml}') }}

      - name: Build cpp circuits
        run: |
          chmod +x circuits/scripts/build/build_cpp.sh && \
          ./circuits/scripts/build/build_cpp.sh register &&
          ./circuits/scripts/build/build_cpp.sh register_id &&
          ./circuits/scripts/build/build_cpp.sh disclose &&
          ./circuits/scripts/build/build_cpp.sh dsc

      - name: Save circuits cache
        if: steps.circuits-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: output
          key: circuits-output-v1-${{ hashFiles('circuits/circuits/**', 'circuits/scripts/**', 'circuits/*.{json,yml,yaml}') }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: circuits
          path: output/
