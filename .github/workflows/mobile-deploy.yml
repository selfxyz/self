name: Deploy to Internal Testers

on:
  push:
    branches:
      - staging  # Runs when staging is updated
    paths:
      - "app/**"  # Only run when app files change
      - ".github/workflows/mobile-deploy.yml"

jobs:
  build-ios:
    if: false # skip for now
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
          
      - name: Install app dependencies
        run: |
          cd app
          yarn install

      - name: Build and upload to TestFlight (Internal)
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          cd app
          bundle exec fastlane ios internal_test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
          
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Create workspace and copy repository
        run: |
          mkdir -p /github/workspace
          cp -r ${GITHUB_REPOSITORY_WORKSPACE:-$(pwd)} /github/workspace/
          cd /github/workspace
          
      - name: Create non-root user # bundle install complains when running as root
        run: |
          useradd -m -s /bin/bash runner
          chown -R runner:runner /opt/acttoolcache/
          chown -R runner:runner /opt/hostedtoolcache/ /github/workspace
          
      - name: Install app dependencies
        run: |
          su - runner -c "export PATH=/opt/hostedtoolcache/Ruby/3.2.7/x64/bin:$PATH && cd /github/workspace/self/app && bundle install"
          cd /github/workspace/self/app
          corepack enable
          yarn install

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: Build and upload to Google Play Internal Testing
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd app
          bundle exec fastlane android internal_test 