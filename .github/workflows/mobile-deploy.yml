name: Deploy to Internal Testers

env:
  RUBY_VERSION: 3.2
  RUBY_HOME: /opt/hostedtoolcache/Ruby/3.2.7/x64 # keep in sync with RUBY_VERSION
  RUNNER_PROFILE: /home/runner/.profile
  WORKSPACE: /github/workspace

on:
  push:
    branches:
      - staging # Runs when staging is updated
    paths:
      - "app/**" # Only run when app files change
      - ".github/workflows/mobile-deploy.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mobile Dependencies
        uses: ./.github/actions/mobile-setup
        with:
          ruby_version: ${{ env.RUBY_VERSION }}
          ruby_home: ${{ env.RUBY_HOME }}
          runner_profile: ${{ env.RUNNER_PROFILE }}
          workspace: ${{ env.WORKSPACE }}

      - name: Verify iOS Secrets
        run: |
          # Set common variables
          API_KEY="${{ secrets.APP_STORE_CONNECT_API_KEY }}"
          ISSUER_ID="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          KEY_ID="${{ secrets.APP_STORE_CONNECT_KEY_ID }}"

          # Verify App Store Connect API Key exists and is valid base64
          if ! echo "$API_KEY" | base64 -d >/dev/null 2>&1; then
            echo "❌ Error: Invalid App Store Connect API Key format (should be base64 encoded)"
            exit 1
          fi

          # Verify Issuer ID is in correct format (UUID)
          if ! echo "$ISSUER_ID" | grep -E "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" >/dev/null; then
            echo "❌ Error: Invalid App Store Connect Issuer ID format (should be UUID)"
            exit 1
          fi

          # Verify Key ID is in correct format (alphanumeric)
          if ! echo "$KEY_ID" | grep -E "^[A-Z0-9]{10}$" >/dev/null; then
            echo "❌ Error: Invalid App Store Connect Key ID format"
            exit 1
          fi

          # Try to authenticate with App Store Connect API
          if ! fastlane spaceauth -u "$ISSUER_ID" -k "$KEY_ID" -i "$API_KEY" --silent >/dev/null 2>&1; then
            echo "❌ Error: Failed to authenticate with App Store Connect API"
            exit 1
          fi

          echo "✅ All iOS secrets verified successfully!"

      - name: Build and upload to TestFlight (Internal)
        run: |
          su - runner -c "
            export APP_STORE_CONNECT_API_KEY=${{ secrets.APP_STORE_CONNECT_API_KEY }}
            export APP_STORE_CONNECT_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
            export APP_STORE_CONNECT_KEY_ID=${{ secrets.APP_STORE_CONNECT_KEY_ID }}
            cd ${{ env.WORKSPACE }}/self/app && fastlane ios internal_test
          "

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mobile Dependencies
        uses: ./.github/actions/mobile-setup
        with:
          ruby_version: ${{ env.RUBY_VERSION }}
          ruby_home: ${{ env.RUBY_HOME }}
          runner_profile: ${{ env.RUNNER_PROFILE }}
          workspace: ${{ env.WORKSPACE }}

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > ${{ env.WORKSPACE }}/self/app/android/app/upload-keystore.jks

      - name: Verify Android Secrets
        run: |
          # Set common variables
          KEYSTORE="${{ env.WORKSPACE }}/self/app/android/app/upload-keystore.jks"
          STOREPASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEYPASS="${{ secrets.ANDROID_KEY_PASSWORD }}"

          # Verify keystore file exists and is valid
          if [ ! -f "$KEYSTORE" ]; then
            echo "❌ Error: Keystore file was not created successfully"
            exit 1
          fi

          # Verify keystore and credentials
          keytool_verify() {
            keytool -list -v -keystore "$KEYSTORE" "$@" 2>/dev/null | grep -q "Certificate fingerprints:"
          }

          # Verify keystore password
          if ! keytool_verify -storepass "$STOREPASS"; then
            echo "❌ Error: Invalid keystore password"
            exit 1
          fi

          # Verify key alias exists
          if ! keytool_verify -storepass "$STOREPASS" -alias "$ALIAS" | grep -q "Alias name:"; then
            echo "❌ Error: Key alias '$ALIAS' not found in keystore"
            exit 1
          fi

          # Verify key password
          if ! keytool_verify -storepass "$STOREPASS" -alias "$ALIAS" -keypass "$KEYPASS"; then
            echo "❌ Error: Invalid key password"
            exit 1
          fi

          # Verify Play Store JSON key is valid JSON
          if ! echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | jq '.' >/dev/null 2>&1; then
            echo "❌ Error: Invalid Play Store JSON key format"
            exit 1
          fi

          echo "✅ All Android secrets verified successfully!"

      - name: Build and upload to Google Play Internal Testing
        run: |
          su - runner -c "
            export PLAY_STORE_JSON_KEY=${{ secrets.PLAY_STORE_JSON_KEY }}
            export ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            export ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
            export ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
            cd ${{ env.WORKSPACE }}/self/app && fastlane android internal_test
          "
