name: Deploy to Internal Testers

env:
  # TODO: add beta lane, act on new numeric version tag
  # TODO: 3.2.7 may increment on it's own, need to find a dynamic way to set this
  RUBY_VERSION: 3.2
  RUBY_HOME: /opt/hostedtoolcache/Ruby/3.2.7/x64 # keep in sync with RUBY_VERSION
  WORKSPACE: /github/workspace

on:
  push:
    branches:
      - staging # Runs when staging is updated
    paths:
      - "app/**" # Only run when app files change
      - ".github/workflows/mobile-deploy.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mobile Dependencies
        uses: ./.github/actions/mobile-setup
        with:
          ruby_version: ${{ env.RUBY_VERSION }}
          ruby_home: ${{ env.RUBY_HOME }}
          workspace: ${{ env.WORKSPACE }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify iOS Secrets
        run: |
          # Verify App Store Connect API Key exists and contains PEM header
          if ! echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | grep -F "BEGIN PRIVATE KEY" >/dev/null 2>&1; then
            echo "❌ Error: Invalid App Store Connect API Key format (should contain PEM private key)"
            exit 1
          fi
          # Verify Issuer ID is in correct format (UUID)
          if ! echo "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" | grep -E "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" >/dev/null; then
            echo "❌ Error: Invalid App Store Connect Issuer ID format (should be UUID)"
            exit 1
          fi
          # Verify Key ID is in correct format (alphanumeric)
          if ! echo "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" | grep -E "^[A-Z0-9]{10}$" >/dev/null; then
            echo "❌ Error: Invalid App Store Connect Key ID format"
            exit 1
          fi
          echo "✅ All iOS secrets verified successfully!"

      - name: Build and upload to TestFlight (Internal)
        env:
          APP_STORE_APPLE_ID: ${{ secrets.APP_STORE_APPLE_ID }}
          APP_STORE_APP_IDENTIFIER: ${{ secrets.APP_STORE_APP_IDENTIFIER }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_TEAM_ID: ${{ secrets.APP_STORE_TEAM_ID }}
        run: |
          cd ${{ env.WORKSPACE }}/self/app
          bundle exec fastlane ios internal_test --verbose

      - uses: actions/checkout@v4
      - name: Update build number
        uses: ./.github/actions/push-changes
        with:
          commit_message: "bump ios build number"

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mobile Dependencies
        uses: ./.github/actions/mobile-setup
        with:
          ruby_version: ${{ env.RUBY_VERSION }}
          ruby_home: ${{ env.RUBY_HOME }}
          workspace: ${{ env.WORKSPACE }}

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > ${{ env.WORKSPACE }}/self/app/android/app/upload-keystore.jks

      - name: Verify Android Secrets
        run: |
          # Verify keystore file exists and is valid
          if [ ! -f "${{ env.WORKSPACE }}/self/app/android/app/upload-keystore.jks" ]; then
            echo "❌ Error: Keystore file was not created successfully"
            exit 1
          fi
          # Try to verify the keystore with the provided password
          if ! keytool -list -v -keystore "${{ env.WORKSPACE }}/self/app/android/app/upload-keystore.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
            echo "❌ Error: Invalid keystore password"
            exit 1
          fi
          # Verify the key alias exists
          if ! keytool -list -v -keystore "${{ env.WORKSPACE }}/self/app/android/app/upload-keystore.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" >/dev/null 2>&1; then
            echo "❌ Error: Key alias '${{ secrets.ANDROID_KEY_ALIAS }}' not found in keystore"
            exit 1
          fi
          # Verify the key password
          if ! keytool -list -v -keystore "${{ env.WORKSPACE }}/self/app/android/app/upload-keystore.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" >/dev/null 2>&1; then
            echo "❌ Error: Invalid key password"
            exit 1
          fi
          # Verify Play Store JSON key is valid JSON
          if ! echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | jq '.' >/dev/null 2>&1; then
            echo "❌ Error: Invalid Play Store JSON key format"
            exit 1
          fi
          echo "✅ All Android secrets verified successfully!"

      - name: Build and upload to Google Play Internal Testing
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd ${{ env.WORKSPACE }}/self/app
          bundle exec fastlane android internal_test --verbose

      - uses: actions/checkout@v4
      - name: Update build number
        uses: ./.github/actions/push-changes
        with:
          commit_message: "bump android build number"
