name: Deploy to Internal Testers

env:
  RUBY_HOME: /opt/hostedtoolcache/Ruby/3.2.7/x64
  RUNNER_PROFILE: /home/runner/.profile
  WORKSPACE: /github/workspace

on:
  push:
    branches:
      - staging # Runs when staging is updated
    paths:
      - "app/**" # Only run when app files change
      - ".github/workflows/mobile-deploy.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mobile Dependencies
        uses: ./.github/actions/mobile-setup
        with:
          ruby_home: ${{ env.RUBY_HOME }}
          runner_profile: ${{ env.RUNNER_PROFILE }}
          workspace: ${{ env.WORKSPACE }}

      - name: Build and upload to TestFlight (Internal)
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          cd app
          bundle exec fastlane ios internal_test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mobile Dependencies
        uses: ./.github/actions/mobile-setup
        with:
          ruby_home: ${{ env.RUBY_HOME }}
          runner_profile: ${{ env.RUNNER_PROFILE }}
          workspace: ${{ env.WORKSPACE }}

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > ${WORKSPACE}/self/app/android/app/upload-keystore.jks

      - name: Build and upload to Google Play Internal Testing
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          su - runner -c "cd ${WORKSPACE}/self/app && bundle exec fastlane android internal_test"
