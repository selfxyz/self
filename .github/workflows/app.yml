name: App CI
env:
  # Build environment versions
  NODE_VERSION: 18
  RUBY_VERSION: 3.2
  JAVA_VERSION: 17
  # Path configuration
  WORKSPACE: ${{ github.workspace }}
  APP_PATH: ${{ github.workspace }}/app
on:
  push:
    paths:
      - "common/**"
      - "app/**"
      - ".github/workflows/app.yml"
      - ".github/actions/**"

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup and Cache Dependencies
        uses: ./.github/actions/setup-and-cache-deps
        with:
          app_path: app
          node_version: ${{ env.NODE_VERSION }}
          platform: 'linux'
      - name: Build Dependencies
        run: yarn build:deps
        working-directory: ./app
      - name: Run linter
        run: yarn lint
        working-directory: ./app
      - name: Run prettier
        run: yarn fmt
        working-directory: ./app

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup and Cache Dependencies
        uses: ./.github/actions/setup-and-cache-deps
        with:
          app_path: app
          node_version: ${{ env.NODE_VERSION }}
          platform: 'linux'

      - name: Build
        run: yarn build:deps
        working-directory: ./app
      - name: Test
        run: yarn test
        working-directory: ./app
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # some cocoapods won't compile with xcode 16.3
          xcode-version: "16.2"

      - uses: actions/checkout@v4
      - name: Setup and Cache Dependencies
        uses: ./.github/actions/setup-and-cache-deps
        with:
          app_path: app
          node_version: ${{ env.NODE_VERSION }}
          ruby_version: ${{ env.RUBY_VERSION }}
          platform: 'ios'
      - name: Install And Build
        run: yarn install-app
        working-directory: ./app
