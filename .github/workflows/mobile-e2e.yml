name: Mobile E2E

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/mobile-e2e.yml'

jobs:
  e2e:
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable
      - run: yarn install
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Run Android flow
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd app && yarn build:deps && yarn test:e2e:android
      - name: Run iOS flow
        if: matrix.platform == 'ios'
        run: |
          cd app
          yarn build:deps
          cd ios
          pod install
          cd ..
          xcrun simctl boot "iPhone 15" || true
          yarn test:e2e:ios
