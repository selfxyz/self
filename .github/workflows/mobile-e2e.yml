name: Mobile E2E

env:
  # Build environment versions
  NODE_VERSION: 18
  JAVA_VERSION: 17
  ANDROID_API_LEVEL: 33
  ANDROID_NDK_VERSION: 27.0.11718014
  # Performance optimizations
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
  CI: true
  # Disable Maestro analytics in CI
  MAESTRO_CLI_NO_ANALYTICS: true

on:
  push:
    branches: [main, release/**]
    paths:
      - "app/**"
      - ".github/workflows/mobile-e2e.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/mobile-e2e.yml"

jobs:
  e2e:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable
      - run: corepack prepare yarn@4.6.0 --activate
      - run: yarn install --immutable --silent
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
        env:
          MAESTRO_VERSION: 1.41.0
      - name: Setup Java environment
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Install NDK
        if: matrix.platform == 'android'
        run: sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
      - name: Run Android flow
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096
          disable-animations: true
          script: |
            echo "Waiting for emulator to be ready..."
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed | tr -d '\r') ]]; do sleep 1; done; input keyevent 82'
            echo "Emulator is ready"
            cd app
            echo "Building dependencies..."
            if ! yarn build:deps --silent; then
              echo "❌ Dependency build failed"
              exit 1
            fi
            cd android
            echo "Building Android APK..."
            if ! ./gradlew assembleDebug --quiet; then
              echo "❌ Android build failed"
              exit 1
            fi
            echo "✅ Android build succeeded"
            cd ..
            echo "Installing app on emulator..."
            if ! adb install android/app/build/outputs/apk/debug/app-debug.apk; then
              echo "❌ Android app installation failed"
              exit 1
            fi
            echo "✅ App successfully installed"
            echo "Running Maestro tests..."
            # Run Maestro test (no platform flag needed - auto-detects Android emulator)
            maestro test e2e/launch.flow.yaml --format junit --output maestro-results.xml || {
              echo "Maestro test failed, but continuing to upload results..."
              exit 1
            }
      - name: Run iOS flow
        if: matrix.platform == 'ios'
        run: |
          cd app
          echo "Building dependencies..."
          if ! yarn build:deps --silent; then
            echo "❌ Dependency build failed"
            exit 1
          fi
          cd ios
          echo "Installing iOS dependencies..."
          if ! pod install --silent; then
            echo "❌ Pod install failed"
            exit 1
          fi
          cd ..

          # Boot simulator and wait for it to be ready
          echo "Setting up iOS Simulator..."
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl bootstatus "iPhone 15" -b

          # Build the app (silenced for cleaner e2e logs)
          echo "Building iOS app..."
          if ! xcodebuild -workspace ios/OpenPassport.xcworkspace -scheme OpenPassport -configuration Debug -sdk iphonesimulator -derivedDataPath ios/build -jobs $(sysctl -n hw.ncpu) -parallelizeTargets -quiet; then
            echo "❌ iOS build failed"
            exit 1
          fi
          echo "✅ iOS build succeeded"

          # Install the app on simulator
          echo "Installing app on simulator..."
          APP_PATH=$(find ios/build/Build/Products/Debug-iphonesimulator -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Could not find built iOS app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          if ! xcrun simctl install "iPhone 15" "$APP_PATH"; then
            echo "❌ iOS app installation failed"
            exit 1
          fi

          # Verify the app is installed
          echo "Verifying app installation..."
          xcrun simctl listapps "iPhone 15" | grep -q "com.warroom.proofofpassport" && echo "✅ App successfully installed" || {
            echo "❌ App installation verification failed"
            exit 1
          }

          # Run Maestro test (no platform flag needed - auto-detects iOS simulator)
          echo "Running Maestro tests..."
          maestro test e2e/launch.flow.yaml --format junit --output maestro-results.xml || {
            echo "Maestro test failed, but continuing to upload results..."
            exit 1
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-${{ matrix.platform }}
          path: app/maestro-results.xml
