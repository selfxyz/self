name: Mobile E2E

env:
  # Build environment versions
  NODE_VERSION: 18
  JAVA_VERSION: 17
  ANDROID_API_LEVEL: 33
  ANDROID_NDK_VERSION: 27.0.11718014
  # Performance optimizations
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
  CI: true
  # Disable Maestro analytics in CI
  MAESTRO_CLI_NO_ANALYTICS: true

on:
  push:
    branches: [main, release/**]
    paths:
      - "app/**"
      - ".github/workflows/mobile-e2e.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/mobile-e2e.yml"

jobs:
  e2e-android:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable
      - run: corepack prepare yarn@4.6.0 --activate
      - run: yarn install --immutable --silent
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 1.41.0
      - name: Setup Java environment
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
      - name: Run Android flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096
          disable-animations: true
          script: |
            echo "Waiting for emulator to be ready..."
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed | tr -d '\r') ]]; do sleep 1; done; input keyevent 82'
            echo "Emulator is ready"
            echo "Building dependencies..."
            yarn workspace @selfxyz/mobile-app build:deps --silent || { echo "❌ Dependency build failed"; exit 1; }
            echo "Building Android APK..."
            # Note: Using Release builds to avoid Metro dependency in CI
            # Debug builds require Metro server, Release builds have JS bundled
            # Run the build inside the android directory so gradlew is available
            echo "Current working directory: $(pwd)"
            echo "Checking if gradlew exists:"
            ls -la app/android/gradlew || echo "gradlew not found in app/android/"
            (cd app/android && chmod +x ./gradlew && ./gradlew assembleRelease --quiet) || { echo "❌ Android build failed"; exit 1; }
            echo "✅ Android build succeeded"
            echo "Installing app on emulator..."
            # Check if APK was built successfully
            APK_PATH="app/android/app/build/outputs/apk/release/app-release.apk"
            echo "Looking for APK at: $APK_PATH"
            if [ ! -f "$APK_PATH" ]; then
              echo "❌ APK not found at expected location"
              echo "Available files in build directory:"
              find app/android/app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
              exit 1
            fi
            adb install "$APK_PATH" || { echo "❌ Android app installation failed"; exit 1; }
            echo "✅ App successfully installed"
            echo "Running Maestro tests..."
            # Run Maestro test on Android
            maestro test app/e2e/launch.flow.yaml --platform android --format junit --output app/maestro-results.xml || {
              echo "Maestro test failed, but continuing to upload results..."
              exit 1
            }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-android
          path: app/maestro-results.xml

  e2e-ios:
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable
      - run: corepack prepare yarn@4.6.0 --activate
      - run: yarn install --immutable --silent
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 1.41.0
      - name: Run iOS flow
        run: |
          echo "Building dependencies..."
          if ! yarn workspace @selfxyz/mobile-app build:deps --silent; then
            echo "❌ Dependency build failed"
            exit 1
          fi
          cd app/ios
          echo "Installing iOS dependencies..."
          if ! pod install --silent; then
            echo "❌ Pod install failed"
            exit 1
          fi
          cd ../..

          # Boot simulator and wait for it to be ready
          echo "Setting up iOS Simulator..."
          echo "Available simulators:"
          xcrun simctl list devices | grep "iPhone 15"
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl bootstatus "iPhone 15" -b
          echo "Simulator status:"
          xcrun simctl list devices | grep "iPhone 15"

          # Build the app (silenced for cleaner e2e logs)
          echo "Building iOS app..."
          # Note: Using Release builds to avoid Metro dependency in CI
          # Debug builds require Metro server, Release builds have JS bundled
          if ! xcodebuild -workspace app/ios/OpenPassport.xcworkspace -scheme OpenPassport -configuration Release -sdk iphonesimulator -derivedDataPath app/ios/build -jobs "$(sysctl -n hw.ncpu)" -parallelizeTargets -quiet; then
            echo "❌ iOS build failed"
            exit 1
          fi
          echo "✅ iOS build succeeded"

          # Install the app on simulator
          echo "Installing app on simulator..."
          APP_PATH=$(find app/ios/build/Build/Products/Release-iphonesimulator -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Could not find built iOS app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          # Check the app's bundle ID
          echo "Checking app bundle info:"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist" || echo "Could not read bundle ID"
          /usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "$APP_PATH/Info.plist" || echo "Could not read display name"

          # Uninstall any existing version first
          echo "Removing any existing app installation..."
          xcrun simctl uninstall "iPhone 15" "com.warroom.proofofpassport" 2>/dev/null || true

          # Install the app with verbose output
          echo "Installing app..."
          xcrun simctl install "iPhone 15" "$APP_PATH"
          INSTALL_EXIT_CODE=$?
          if [ $INSTALL_EXIT_CODE -ne 0 ]; then
            echo "❌ iOS app installation failed with exit code: $INSTALL_EXIT_CODE"
            exit 1
          fi

          # Verify the app is installed and show details
          echo "Verifying app installation..."
          echo "All installed apps with 'passport' in name:"
          xcrun simctl listapps "iPhone 15" | grep -i passport || echo "No apps with 'passport' found"
          echo "Checking for exact bundle ID:"
          if xcrun simctl listapps "iPhone 15" | grep -q "com.warroom.proofofpassport"; then
            echo "✅ App successfully installed"
          else
            echo "❌ App installation verification failed"
            echo "Full app list:"
            xcrun simctl listapps "iPhone 15"
            exit 1
          fi

          # Test if the app can be launched directly
          echo "Testing app launch capability..."
          xcrun simctl launch "iPhone 15" "com.warroom.proofofpassport" || {
            echo "⚠️ Direct app launch test failed - checking if app is launchable"
            echo "This might be expected if the app has launch conditions"
          }

          # Run Maestro test on iOS
          echo "Running Maestro tests..."
          echo "Maestro device detection:"
          maestro status || echo "Maestro status check failed"
          echo "Starting test execution..."
          maestro test app/e2e/launch.flow.yaml --platform ios --format junit --output app/maestro-results.xml || {
            echo "Maestro test failed, but continuing to upload results..."
            exit 1
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-ios
          path: app/maestro-results.xml
