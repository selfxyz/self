name: Circuits CI
on:
  push:
    branches:
      - dev
      - main
      - openpassportv2
    paths:
      - "circuits/**"
      - "common/**"
  pull_request:
    branches:
      - dev
      - main
      - openpassportv2
    paths:
      - "circuits/**"
      - "common/**"
jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        uses: ./.github/actions/yarn-install
      - name: Install Yarn dependencies
        run: yarn workspaces focus @selfxyz/circuits
      - name: Run lint
        run: yarn workspace @selfxyz/circuits lint

  tests:
    if: github.event.pull_request.draft == false
    needs: lint
    runs-on: ubuntu-latest
    environment: development
    strategy:
      matrix:
        script:
          - test-custom-hasher
          - test-disclose
          - test-disclose-id
          - test-dsc
          - test-ecdsa
          - test-is-older-than
          - test-is-valid
          - test-not-in-list
          - test-ofac
          - test-register
          - test-register-id
          - test-rsa
          - test-rsa-pss
    steps:
      - uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/circuits.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libgmp-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Circom Binary
        id: cache-circom
        uses: actions/cache@v4
        with:
          path: /tmp/circom
          key: ${{ runner.os }}-circom-v2.1.9

      - name: Download Circom Binary v2.1.9
        if: steps.cache-circom.outputs.cache-hit != 'true'
        run: |
          wget -qO /tmp/circom https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          chmod +x /tmp/circom

      - name: Install Circom
        run: sudo mv /tmp/circom /bin/circom

      - name: Print Circom version
        run: circom --version

      # Note: Circuit build caching disabled since circuits are compiled on-demand during tests
      # The actual circuit compilation is expensive and handled separately in circuits-build.yml

      - name: Install Dependencies
        uses: ./.github/actions/yarn-install

      - name: Install Yarn dependencies
        run: yarn workspaces focus @selfxyz/circuits

      - name: Build common
        run: yarn workspace @selfxyz/common build

      - name: Build circuits
        run: echo "Circuits will be built on-demand during tests with recompile=true"

      - name: Run tests
        env:
          NODE_MEMORY_LIMIT: 6144
          FULL_TEST_SUITE: false
        run: yarn workspace @selfxyz/circuits ${{ matrix.script }}
