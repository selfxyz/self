name: Self Circuits CI/CD
on:
  push:
    branches:
      - dev
      - main
      - openpassportv2
    paths:
      - 'circuits/**'
      - 'common/**'
  pull_request:
    branches:
      - dev
      - main
      - openpassportv2
    paths:
      - 'circuits/**'
      - 'common/**'
jobs:
  run_circuit_tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      # Circom installation from https://github.com/erhant/circomkit/blob/main/.github/workflows/tests.yml
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libgmp-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev

      - name: Set Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Circom Binary v2.1.9
        run: |
          wget -qO /home/runner/work/circom https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          chmod +x /home/runner/work/circom
          sudo mv /home/runner/work/circom /bin/circom

      - name: Print Circom version
        run: circom --version
      - name: "enable yarn"
        run: corepack enable yarn
      - name: Install Yarn dependencies
        run: |
          yarn install --frozen-lockfile
          yarn workspaces focus @selfxyz/circuits

      # Run lint inside the circuits workspace (from the repo root) so that `node_modules` is
      # correctly resolved via the hoisted root installation.
      - name: Run lint (circuits)
        run: yarn workspace @selfxyz/circuits lint

      # Build the circuits (and their internal dependencies) from the root to keep the same CWD
      # during the subsequent test step. Using the workspace command avoids us cd-ing into the
      # package folder which previously broke Circom include paths.
      - name: Build (Circuits + Self dependencies)
        run: yarn workspace @selfxyz/circuits build:deps

      # Execute the circuits test suite from the repository root (keeping CWD==PROJECT_ROOT).
      # This guarantees that the relative include path "node_modules" used by circom_tester
      # resolves to the hoisted root dependencies, fixing the missing file errors seen in CI.
      - name: Run Tests (Circuits)
        env:
          FULL_TEST_SUITE: false
        run: yarn workspace @selfxyz/circuits test
