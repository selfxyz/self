name: Circuits CI
on:
  push:
    branches:
      - dev
      - main
      - openpassportv2
    paths:
      - "circuits/**"
      - "common/**"
  pull_request:
    branches:
      - dev
      - main
      - openpassportv2
    paths:
      - "circuits/**"
      - "common/**"
jobs:
  run_circuit_tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      # Circom installation from https://github.com/erhant/circomkit/blob/main/.github/workflows/tests.yml
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libgmp-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Circom binary
        id: circom-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/circom
          key: circom-v2.1.9

      - name: Download Circom Binary v2.1.9
        if: steps.circom-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/circom
          wget -qO ~/.cache/circom/circom https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          chmod +x ~/.cache/circom/circom

      - name: Save Circom cache
        if: steps.circom-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/circom
          key: circom-v2.1.9

      - name: Install Circom
        run: sudo cp ~/.cache/circom/circom /usr/local/bin/circom

      - name: Print Circom version
        run: circom --version

      - name: Install Yarn dependencies
        uses: ./.github/actions/yarn-install

      - name: Run lint
        run: yarn workspace @selfxyz/circuits lint
      - name: Run Tests (Circuits)
        env:
          FULL_TEST_SUITE: false
        run: yarn workspace @selfxyz/circuits test
