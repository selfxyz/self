name: WebView App CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "common/**"
      - "packages/mobile-sdk-alpha/**"
      - "packages/webview-app/**"
      - "packages/webview-bridge/**"
      - ".github/workflows/webview-app-ci.yml"
      - ".github/actions/**"
      - ".github/CI_FORCE_RUN"
  push:
    branches: [dev, staging, main]
    paths:
      - "common/**"
      - "packages/mobile-sdk-alpha/**"
      - "packages/webview-app/**"
      - "packages/webview-bridge/**"
      - ".github/workflows/webview-app-ci.yml"
      - ".github/actions/**"
      - ".github/CI_FORCE_RUN"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      - name: Cache Turbo
        uses: ./.github/actions/cache-turbo
        with:
          key-prefix: webview-app-build
      - name: Build webview-app and dependencies
        run: pnpm exec turbo run build --filter="@selfxyz/webview-app"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      - name: Cache Turbo
        uses: ./.github/actions/cache-turbo
        with:
          key-prefix: webview-app-lint
      - name: Build dependencies
        run: pnpm exec turbo run build --filter="@selfxyz/webview-app^..."
      - name: Run linter
        run: pnpm --filter @selfxyz/webview-app lint

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      - name: Check Prettier formatting
        run: pnpm --filter @selfxyz/webview-app fmt

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      - name: Cache Turbo
        uses: ./.github/actions/cache-turbo
        with:
          key-prefix: webview-app-types
      - name: Build dependencies
        run: pnpm exec turbo run build --filter="@selfxyz/webview-app^..."
      - name: Typecheck
        run: pnpm --filter @selfxyz/webview-app types

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      - name: Cache Turbo
        uses: ./.github/actions/cache-turbo
        with:
          key-prefix: webview-app-test
      - name: Build dependencies
        run: pnpm exec turbo run build --filter="@selfxyz/webview-app^..."
      - name: Test
        run: pnpm --filter @selfxyz/webview-app test
