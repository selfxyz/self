name: Core SDK CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  check_changes:
    runs-on: ubuntu-slim
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if should run
        id: filter
        run: |
          set -e
          if [[ "${{ github.base_ref }}" == "main" ]] || [[ "${{ github.base_ref }}" == "staging" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Running for ${{ github.base_ref }} - no path filter"
          else
            # For dev branch, check if relevant files changed
            # Fetch the base branch to ensure it's available for comparison
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD) || {
              echo "Error: Failed to diff against base branch"
              exit 1
            }
            if echo "$CHANGED_FILES" | grep -qE "^(sdk/core/|common/|\.github/workflows/core-sdk-ci\.yml|\.github/actions/|\.github/CI_FORCE_RUN$)"; then
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "Running for dev - relevant files changed"
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "Skipping for dev - no relevant files changed"
            fi
          fi

  debug_check_changes:
    needs: check_changes
    runs-on: ubuntu-slim
    steps:
      - name: Dump gating values
        env:
          SHOULD_RUN: ${{ needs.check_changes.outputs.should_run }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "needs.check_changes.outputs.should_run = '$SHOULD_RUN'"
          echo "github.event.pull_request.draft       = '$IS_DRAFT'"
          echo "github.event_name                     = '$EVENT_NAME'"

  build:
    needs: check_changes
    if: github.event.pull_request.draft == false && needs.check_changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install
      - name: Build dependencies
        run: |
          pnpm --filter @selfxyz/common build
          pnpm --filter @selfxyz/core build
      - name: Cache build artifacts
        uses: ./.github/actions/cache-core-sdk-build
        with:
          mode: save
          cache-version: v1

  lint:
    runs-on: ubuntu-latest
    needs: [check_changes, build]
    if: github.event.pull_request.draft == false && needs.check_changes.outputs.should_run == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
      - name: Restore build artifacts
        id: build-cache
        uses: ./.github/actions/cache-core-sdk-build
        with:
          mode: restore
          cache-version: v1
          fail-on-cache-miss: false
      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install
      - name: Build dependencies (fallback on cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @selfxyz/common build
          pnpm --filter @selfxyz/core build
      - name: Run linter
        run: pnpm --filter @selfxyz/core lint

  types:
    runs-on: ubuntu-latest
    needs: [check_changes, build]
    if: github.event.pull_request.draft == false && needs.check_changes.outputs.should_run == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
      - name: Restore build artifacts
        id: build-cache
        uses: ./.github/actions/cache-core-sdk-build
        with:
          mode: restore
          cache-version: v1
          fail-on-cache-miss: false
      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install
      - name: Build dependencies (fallback on cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @selfxyz/common build
          pnpm --filter @selfxyz/core build
      - name: Type checking
        run: pnpm --filter @selfxyz/core types

  test:
    runs-on: ubuntu-latest
    needs: [check_changes, build]
    if: github.event.pull_request.draft == false && needs.check_changes.outputs.should_run == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
      - name: Restore build artifacts
        id: build-cache
        uses: ./.github/actions/cache-core-sdk-build
        with:
          mode: restore
          cache-version: v1
          fail-on-cache-miss: false
      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install
      - name: Build dependencies (fallback on cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @selfxyz/common build
          pnpm --filter @selfxyz/core build
      - name: Run tests
        run: pnpm --filter @selfxyz/core test
