name: RN Test App CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/rn-sdk/**"
      - "packages/rn-test-app/**"
      - ".github/workflows/rn-test-app-ci.yml"
      - ".github/actions/**"
  push:
    branches: [dev, staging, main]
    paths:
      - "packages/rn-sdk/**"
      - "packages/rn-test-app/**"
      - ".github/workflows/rn-test-app-ci.yml"
      - ".github/actions/**"

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Typecheck rn-sdk
        run: yarn workspace @selfxyz/rn-sdk typecheck
      - name: Test rn-sdk
        run: yarn workspace @selfxyz/rn-sdk test
      - name: Typecheck rn-test-app
        run: yarn workspace @selfxyz/rn-test-app types
