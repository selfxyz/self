name: Contracts CI
on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - "contracts/**"
      - "common/**"
      - ".github/workflows/contracts.yml"

concurrency:
  group: contracts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_contracts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Read and sanitize Node.js version
        shell: bash
        run: |
          if [ ! -f .nvmrc ] || [ -z "$(cat .nvmrc)" ]; then
            echo "❌ .nvmrc is missing or empty"; exit 1;
          fi
          VERSION="$(tr -d '\r\n' < .nvmrc)"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid .nvmrc content: '$VERSION'"; exit 1;
          fi
          echo "NODE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NODE_VERSION_SANITIZED=${VERSION//\//-}" >> "$GITHUB_ENV"
      - name: Cache Yarn dependencies
        uses: ./.github/actions/cache-yarn
        with:
          path: |
            .yarn/cache
          cache-version: v4
      - name: Clean Yarn cache (one-off bust)
        run: |
          corepack enable
          corepack prepare yarn@4.6.0 --activate
          rm -rf .yarn/cache
          yarn cache clean --all
      - name: Install Dependencies
        uses: ./.github/actions/yarn-install
      - name: Check ethereum-cryptography version
        run: |
          node - <<'NODE'
          const path = require('path');
          const fs = require('fs');

          let current = path.dirname(require.resolve('ethereum-cryptography'));
          let last = '';
          while (current !== last) {
            const candidate = path.join(current, 'package.json');
            if (fs.existsSync(candidate)) {
              const version = JSON.parse(fs.readFileSync(candidate, 'utf8')).version;
              console.log(version);
              process.exit(0);
            }
            last = current;
            current = path.dirname(current);
          }
          console.error('package.json for ethereum-cryptography not found');
          process.exit(1);
          NODE
        working-directory: ./contracts
      - name: Inspect @noble/hashes/_assert
        run: |
          node - <<'NODE'
          const path = require('path');
          const fs = require('fs');
          const modPath = require.resolve('@noble/hashes/_assert');
          console.log('path:', modPath);
          const mod = require('@noble/hashes/_assert');
          console.log('keys:', Object.keys(mod));
          console.log('default keys:', mod && mod.default ? Object.keys(mod.default) : mod.default);
          console.log('module:', mod);
          const pkgPath = path.join(path.dirname(modPath), '..', 'package.json');
          if (fs.existsSync(pkgPath)) {
            console.log('pkg version:', JSON.parse(fs.readFileSync(pkgPath, 'utf8')).version);
          }
          const data = fs.readFileSync(modPath, 'utf8').split('\n');
          console.log('--- _assert.js head ---');
          console.log(data.slice(0, 30).join('\n'));
          console.log('--- _assert.js tail ---');
          console.log(data.slice(-20).join('\n'));
          NODE
        working-directory: ./contracts
      - name: Dump ethereum-cryptography utils snippet
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = require.resolve('ethereum-cryptography/utils.js');
          const data = fs.readFileSync(p, 'utf8');
          console.log('--- utils.js head ---');
          console.log(data.split('\n').slice(0,40).join('\n'));
          console.log('--- utils.js tail ---');
          console.log(data.split('\n').slice(-20).join('\n'));
          NODE
        working-directory: ./contracts
      - name: Prettier Check - Code Formatting
        run: yarn prettier:check
        working-directory: ./contracts
      - name: Build Common Dependencies
        run: yarn workspace @selfxyz/common build
      - name: Build Contracts
        run: yarn build
        working-directory: ./contracts
      - name: Run Tests (Contracts)
        working-directory: ./contracts
        # skip until they get fixed
        if: false
        run: yarn test
