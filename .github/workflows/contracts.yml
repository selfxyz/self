name: Contracts CI
on:
  pull_request:
    # Run on upstream branches so required checks post before promoting to main
    branches:
      - dev
      - staging
      - main

concurrency:
  group: contracts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_contracts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Detect contracts changes
        id: changes
        run: |
          git fetch --no-tags --prune --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          if git diff --name-only FETCH_HEAD...HEAD | grep -E '^(contracts/|common/)' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Contracts workflow
        if: steps.changes.outputs.changed == 'false'
        run: echo "No contracts or common changes detected; skipping Contracts workflow."
      - name: Read and sanitize Node.js version
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          if [ ! -f .nvmrc ] || [ -z "$(cat .nvmrc)" ]; then
            echo "❌ .nvmrc is missing or empty"; exit 1;
          fi
          VERSION="$(tr -d '\r\n' < .nvmrc)"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid .nvmrc content: '$VERSION'"; exit 1;
          fi
          echo "NODE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NODE_VERSION_SANITIZED=${VERSION//\//-}" >> "$GITHUB_ENV"
      - name: Set Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Dependencies
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/yarn-install
      - name: Prettier Check - Code Formatting
        if: steps.changes.outputs.changed == 'true'
        run: yarn prettier:check
        working-directory: ./contracts
      - name: Build Common Dependencies
        if: steps.changes.outputs.changed == 'true'
        run: yarn workspace @selfxyz/common build
      - name: Build Contracts
        if: steps.changes.outputs.changed == 'true'
        run: yarn build
        working-directory: ./contracts
      - name: Run Tests (Contracts)
        if: steps.changes.outputs.changed == 'true' && false # skip until they get fixed
        working-directory: ./contracts
        run: yarn test
