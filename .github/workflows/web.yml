name: Web CI

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/web.yml"
      - ".github/actions/**"

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup and Cache Dependencies
        uses: ./.github/actions/setup-and-cache-deps
        with:
          app_path: app
          node_version: '18'
          platform: 'linux'
      - name: Build dependencies
        shell: bash
        run: yarn workspace @selfxyz/common build
      - name: Build web app
        run: yarn web:build
