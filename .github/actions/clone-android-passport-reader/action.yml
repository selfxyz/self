name: Clone android-passport-reader
description: "Clones the android-passport-reader repository if it does not exist"

inputs:
  working_directory:
    description: "Working directory path (where android/ subdirectory is located)"
    required: false
    default: "."
  github_token:
    description: "GitHub token for private repository access"
    required: true
  skip_private_modules:
    description: "Skip private module cloning (for forks without access)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Clone android-passport-reader
      shell: bash
      run: |
        set -euo pipefail
        # Check if we should skip private module cloning (for forks)
        if [ "${{ inputs.skip_private_modules }}" = "true" ]; then
          echo "🔒 Skipping private module cloning (fork detected or no access token)"
          echo "ℹ️  This is expected for forked PRs - build will continue without private modules"
          exit 0
        fi

        cd "${{ inputs.working_directory }}"

        if [ ! -d "android/android-passport-reader" ]; then
          echo "📦 Cloning android-passport-reader for build..."
          cd android

          # Clone using provided token without embedding it in the remote URL
          if GIT_TERMINAL_PROMPT=0 \
             git -c protocol.version=2 \
                 -c http.extraHeader="AUTHORIZATION: bearer ${{ inputs.github_token }}" \
                 clone --depth 1 https://github.com/selfxyz/android-passport-reader.git; then
            echo "✅ android-passport-reader cloned successfully"
            # Scrub remote to a token-free URL
            git -C android-passport-reader remote set-url origin https://github.com/selfxyz/android-passport-reader.git || true
          else
            echo "❌ Failed to clone android-passport-reader"
            echo "Please ensure a valid github_token (fine-grained, read-only) is provided to this action"
            exit 1
          fi
        elif [ "$CI" = "true" ]; then
          echo "⚠️  android-passport-reader exists in CI - this is unexpected"
          echo "📁 Directory contents:"
          ls -la android/android-passport-reader/ || true
        else
          echo "📁 android-passport-reader already exists - preserving existing directory"
          echo "ℹ️  Local development environment detected - your changes are safe"
        fi
