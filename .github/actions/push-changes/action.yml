name: Push Build Version Changes

description: "Commits and pushes build version changes for mobile platforms"

inputs:
  commit_message:
    description: "Commit message"
    required: true
  commit_path:
    description: "Path to check for changes (e.g. 'ios' or 'android')"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create commit
      shell: bash
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

        # Only add changes in the specified path
        git add "${{ inputs.commit_path }}/"

        # Check if there are any changes in the specified path
        if git diff --staged --quiet; then
          echo "No changes to commit in ${{ inputs.commit_path }}/"
        else
          echo "Files to be committed:"
          git diff --staged --name-only
          echo ""
          git commit -m "chore: ${{ inputs.commit_message }} [skip ci]"
        fi

    - name: Push changes
      shell: bash
      run: |
        # Only proceed if there are commits to push
        if git rev-parse --verify HEAD >/dev/null 2>&1; then
          # Get target branch name - use base branch for PRs, otherwise use current branch
          if [[ ${{ github.ref }} == refs/pull/* ]]; then
            BRANCH_NAME=${{ github.base_ref }}
          else
            BRANCH_NAME=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')
          fi
          
          # Fetch latest changes and update local branch
          git fetch origin "$BRANCH_NAME"
          git checkout -B "$BRANCH_NAME"
          git pull origin "$BRANCH_NAME" --rebase || {
            echo "Failed to pull latest changes from $BRANCH_NAME"
            exit 1
          }
          
          git push origin "$BRANCH_NAME" || {
            echo "Failed to push to $BRANCH_NAME"
            exit 1
          }
        else
          echo "No new commits to push"
        fi
