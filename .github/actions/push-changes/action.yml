name: Push Build Version Changes

description: "Commits and pushes build version changes for mobile platforms"

inputs:
  commit_message:
    description: "Commit message"
    required: true
  commit_path:
    description: "Path to check for changes (e.g. 'ios' or 'android')"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create commit
      shell: bash
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

        # Only add changes in the specified path
        git add "${{ inputs.commit_path }}/"

        # Check if there are any changes in the specified path
        if git diff --staged --quiet; then
          echo "No changes to commit in ${{ inputs.commit_path }}/"
        else
          git commit -m "chore: ${{ inputs.commit_message }} [skip ci]"
        fi

    - name: Push changes
      shell: bash
      run: |
        # Check if there are any changes to push
        if git rev-parse --verify HEAD >/dev/null 2>&1; then
          # Extract branch name from GITHUB_REF (e.g. refs/heads/main -> main)
          BRANCH_NAME=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')
          
          # Ensure we're on the correct branch
          git checkout -B "$BRANCH_NAME"
          
          # Push changes to the correct branch
          git push origin "$BRANCH_NAME" || {
            echo "Failed to push to $BRANCH_NAME"
            exit 1
          }
        else
          echo "No new commits to push"
        fi
