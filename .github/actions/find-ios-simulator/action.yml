name: Find iOS Simulator
description: Finds an available iPhone simulator on the runner and outputs its UUID.

inputs:
  preferred-device:
    description: Preferred iPhone device name.
    required: false
    default: iPhone SE (3rd generation)
  preferred-runtime:
    description: Preferred iOS runtime version (for example 18.4).
    required: false
    default: ""

outputs:
  id:
    description: UUID of the selected iPhone simulator
    value: ${{ steps.find.outputs.id }}
  name:
    description: Name of the selected iPhone simulator
    value: ${{ steps.find.outputs.name }}
  runtime:
    description: Runtime identifier of the selected iPhone simulator
    value: ${{ steps.find.outputs.runtime }}

runs:
  using: composite
  steps:
    - id: find
      shell: bash
      run: |
        PREFERRED_DEVICE="${{ inputs.preferred-device }}"
        PREFERRED_RUNTIME="${{ inputs.preferred-runtime }}"

        SIM_JSON=$(xcrun simctl list devices available -j)
        SIM_SELECTION=$(SIM_JSON="$SIM_JSON" PREFERRED_DEVICE="$PREFERRED_DEVICE" PREFERRED_RUNTIME="$PREFERRED_RUNTIME" python3 - <<'PY'
        import json
        import os
        import re
        import sys

        data = json.loads(os.environ["SIM_JSON"])
        preferred_device = os.environ.get("PREFERRED_DEVICE", "").strip().lower()
        preferred_runtime = os.environ.get("PREFERRED_RUNTIME", "").strip().lower().replace("-", ".")

        candidates = []
        for runtime, devices in data["devices"].items():
            if "iOS" not in runtime:
                continue
            version_match = re.search(r"iOS[- ](\d+(?:[-.]\d+)*)", runtime)
            runtime_version = version_match.group(1).replace("-", ".") if version_match else ""
            for device in devices:
                if not device.get("isAvailable"):
                    continue
                if "iPhone" not in device.get("name", ""):
                    continue
                candidates.append(
                    {
                        "id": device["udid"],
                        "name": device["name"],
                        "runtime": runtime,
                        "runtime_version": runtime_version,
                    }
                )

        def runtime_score(candidate):
            version = candidate["runtime_version"]
            if not version:
                return ()
            return tuple(int(part) for part in version.split("."))

        exact = []
        partial = []
        runtime_only = []
        fallback = []
        for candidate in candidates:
            version_ok = not preferred_runtime or candidate["runtime_version"] == preferred_runtime
            exact_name = preferred_device and candidate["name"].lower() == preferred_device
            partial_name = preferred_device and preferred_device in candidate["name"].lower()
            if version_ok and exact_name:
                exact.append(candidate)
            elif version_ok and partial_name:
                partial.append(candidate)
            elif version_ok:
                runtime_only.append(candidate)
            else:
                fallback.append(candidate)

        for pool in (exact, partial, runtime_only, fallback):
            if pool:
                best = sorted(pool, key=runtime_score, reverse=True)[0]
                print(f'{best["id"]}\t{best["name"]}\t{best["runtime"]}')
                sys.exit(0)

        sys.exit(1)
        PY
        )

        if [ -z "$SIM_SELECTION" ]; then
          echo "No available iPhone simulators found"
          exit 1
        fi

        SIM_ID=$(printf '%s' "$SIM_SELECTION" | cut -f1)
        SIM_NAME=$(printf '%s' "$SIM_SELECTION" | cut -f2)
        SIM_RUNTIME=$(printf '%s' "$SIM_SELECTION" | cut -f3)

        echo "Found simulator: $SIM_NAME ($SIM_ID) [$SIM_RUNTIME]"
        echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
        echo "name=$SIM_NAME" >> "$GITHUB_OUTPUT"
        echo "runtime=$SIM_RUNTIME" >> "$GITHUB_OUTPUT"
