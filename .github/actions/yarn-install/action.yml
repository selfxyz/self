name: Yarn Install

description: Install Yarn v4 and run yarn install.

inputs:
  working_directory:
    description: The directory to install dependencies in.
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install Yarn v4
      shell: bash
      run: |
        corepack enable
        corepack prepare yarn@4.6.0 --activate
        # Ensure we're using the correct version
        yarn --version

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: "yarn"
        cache-dependency-path: yarn.lock

    - name: Install dependencies
      shell: bash
      run: |
        # Retry up to 3 times with exponential backoff for transient Yarn Berry issues
        max_attempts=3
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          echo "Attempt $attempt of $max_attempts..."
          if yarn install --immutable; then
            echo "✓ Dependencies installed successfully"
            exit 0
          else
            exit_code=$?
            if [ $attempt -lt $max_attempts ]; then
              wait_time=$((2 ** attempt))
              echo "✗ Install failed with exit code $exit_code. Retrying in ${wait_time}s..."
              sleep $wait_time
            else
              echo "✗ Install failed after $max_attempts attempts"
              exit $exit_code
            fi
          fi
          attempt=$((attempt + 1))
        done
