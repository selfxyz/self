name: Cache Pods

description: Cache CocoaPods dependencies.

inputs:
  path:
    description: Paths to cache
    required: false
    default: |
      ios/Pods
      ~/Library/Caches/CocoaPods
  lockfile:
    description: Path to Podfile.lock
    required: false
    default: ios/Podfile.lock
  cache-version:
    description: Additional cache version segment
    required: false
    default: v1

outputs:
  cache-hit:
    description: Whether an exact match was found for the cache key
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - id: cache
      name: Cache Pods
      uses: actions/cache@v4
      with:
        path: ${{ inputs.path }}
        # No restore-keys: a Pods sandbox built against a different Podfile.lock
        # carries a stale Pods/Local Podspecs (e.g. an old hermes-engine version),
        # and `pod install --clean-install` aborts on the skew. Only reuse an exact
        # lockfile match; a changed lock falls back to a clean cold install.
        key: ${{ runner.os }}-pods-${{ inputs.cache-version }}-${{ hashFiles(inputs.lockfile) }}
