appId: com.warroom.proofofpassport
---
- clearState
- clearKeychain
- launchApp
- repeat:
    times: 24
    while:
      notVisible:
        id: "home-screen-root"
    commands:
      - tapOn:
          id: "disclaimer-dismiss-button"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1000
- extendedWaitUntil:
    visible:
      id: "home-screen-root"
    timeout: ${LAUNCH_WAIT_MS:120000}
