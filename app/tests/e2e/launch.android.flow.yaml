appId: com.proofofpassportapp
---
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      android.permission.POST_NOTIFICATIONS: allow
      android.permission.CAMERA: allow
      android.permission.RECORD_AUDIO: allow
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: launch-get-started-button
    timeout: 90000
- tapOn:
    id: launch-get-started-button
