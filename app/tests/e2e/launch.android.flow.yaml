appId: com.proofofpassportapp
---
- clearState
- clearKeychain
- launchApp
- extendedWaitUntil:
    visible:
      id: "disclaimer-screen-root"
    timeout: 60000
- tapOn:
    id: "disclaimer-dismiss-button"
- extendedWaitUntil:
    visible:
      id: "home-screen-root"
    timeout: ${LAUNCH_WAIT_MS:120000}
