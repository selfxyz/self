// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        compileSdkVersion = project.hasProperty('compileSdkVersion') ? compileSdkVersion.toInteger() : 35
        targetSdkVersion = project.hasProperty('targetSdkVersion') ? targetSdkVersion.toInteger() : 35
        minSdkVersion = project.hasProperty('minSdkVersion') ? minSdkVersion.toInteger() : 24
        buildToolsVersion = project.hasProperty('buildToolsVersion') ? buildToolsVersion : "35.0.0"
        kotlinVersion = project.hasProperty('kotlinVersion') ? kotlinVersion : "2.1.20"

        // kotlin_version = '1.7.20'
        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        // ndkVersion = "23.1.7779620"

    }

    repositories {
        google()
        jcenter()
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {

        google()
        jcenter()
        mavenCentral()
        mavenLocal()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
