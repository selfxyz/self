// Top-level build file where you can add configuration options common to all sub-projects/modules.

// react-native-passport-reader ships gradle.properties with includeReactNative=false
// for its standalone/KMP publish path, which excludes the RN bridge module
// (io.tradle.nfc.RNPassportReaderModule) that MainActivity links against. Force it
// back on for the app build before the module's build.gradle reads findProperty().
gradle.beforeProject { project ->
    if (project.name == 'react-native-passport-reader') {
        project.extensions.extraProperties.set('includeReactNative', 'true')
    }
}

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // Updated NDK to support 16k page size devices (RN 0.77)
        ndkVersion = "28.0.13004108"
        // ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        firebaseMessagingVersion = "23.4.0"
        firebaseBomVersion = "32.7.3"
    }
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.12.0')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.google.gms:google-services:4.4.0'
        // Removed firebase-crashlytics (no usages)—add back 3.x if still applied in modules.
        // Removed rust-android-gradle plugin; keep only if you re-enable Rust integration.
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://jitpack.io' }
        maven { url "https://raw.githubusercontent.com/didit-protocol/sdk-android/main/repository" }
    }
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('io.fotoapparat:fotoapparat') using module('com.github.fotoapparat:fotoapparat:2.7.0')
        }
        // Exclude com.gemalto.jp2:jp2-android (ships non-16KB-aligned libopenjpeg.so).
        // JMRTD's pure-Java JJ2000Decoder handles JP2 decoding without it.
        exclude group: 'com.gemalto.jp2', module: 'jp2-android'
    }
    configurations.all {
        resolutionStrategy {
            force 'com.google.firebase:firebase-iid:21.1.0'
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                def manifestFile = project.file('src/main/AndroidManifest.xml')
                def buildGradleFile = project.file('build.gradle')
                def buildGradleKtsFile = project.file('build.gradle.kts')

                def isLikelyJavaPackage = { value ->
                    value != null && (value ==~ /^[a-zA-Z_]\w*(\.[a-zA-Z_]\w*)+$/)
                }

                def extractNamespace = { text ->
                    if (!text) return null
                    def namespaceMatcher = text =~ /namespace\s*(?:=\s*)?['"](.+?)['"]/ 
                    return namespaceMatcher.find() ? namespaceMatcher[0][1] : null
                }

                if (buildGradleFile.exists()) {
                    def buildGradleText = buildGradleFile.text
                    def detectedNamespace = extractNamespace(buildGradleText)
                    if (detectedNamespace) {
                        namespace = detectedNamespace
                        println "Set namespace for ${project.name} to ${namespace} from build.gradle"
                        return
                    }
                }

                if (buildGradleKtsFile.exists()) {
                    def buildGradleKtsText = buildGradleKtsFile.text
                    def detectedNamespace = extractNamespace(buildGradleKtsText)
                    if (detectedNamespace) {
                        namespace = detectedNamespace
                        println "Set namespace for ${project.name} to ${namespace} from build.gradle.kts"
                        return
                    }
                }

                if (manifestFile.exists()) {
                    def manifestText = manifestFile.text
                    def packageMatcher = manifestText =~ /package="([\w\.]+)"/
                    if (packageMatcher.find()) {
                        def packageName = packageMatcher[0][1]
                        namespace = packageName
                        println "Set namespace for ${project.name} to ${namespace} from AndroidManifest.xml"
                    } else if (isLikelyJavaPackage(project.group?.toString())) {
                        namespace = project.group
                        println "No 'package' attribute found. Set namespace for ${project.name} to ${namespace}"
                    } else {
                        println "No namespace inferred for ${project.name}; leaving existing Android plugin defaults unchanged"
                    }
                } else if (isLikelyJavaPackage(project.group?.toString())) {
                    namespace = project.group
                    println "AndroidManifest.xml not found. Set namespace for ${project.name} to ${namespace}"
                } else {
                    println "AndroidManifest.xml not found and no valid namespace fallback for ${project.name}; leaving defaults unchanged"
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
