packages:
  - app
  - circuits
  - common
  - contracts
  - new-common
  - packages/*
  - prover/tests
  - scripts/tests
  - sdk/*

# React Native autolinking requires a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

# Whitelist of packages allowed to run install scripts (pnpm 11 default-denies).
# Audited 2026-06-17: each entry's install script reviewed; rationale inline.
# Add new entries only after auditing the postinstall script.
allowBuilds:
  '@parcel/watcher': true # native file-watcher; install builds from source
  '@scarf/scarf': false # telemetry phone-home; denied
  '@sentry/cli': true # postinstall downloads the sentry-cli binary
  '@swc/core': true # postinstall fetches the native SWC binary
  '@zk-email/zk-regex-circom': false # install script is a bare `echo`; nothing to build
  blake-hash: true # native node-gyp prebuild
  esbuild: true # postinstall fetches the platform esbuild binary
  keccak: true # native node-gyp prebuild
  less: true # @parcel/css-related native build; pnpm flags less@4.x install scripts
  lmdb: true # native node-gyp-build-optional-packages
  msgpackr-extract: true # native node-gyp-build-optional-packages
  node-forge: true # remicolin/forge fork builds native crypto; pnpm matches by name
  node-forge@https://codeload.github.com/remicolin/forge/tar.gz/17a11a632dd0e50343b3b8393245a2696f78afbb: true # explicit tarball-key form of the fork above
  protobufjs: true # postinstall generates the CLI shim
  react-native-inappbrowser-reborn: false # postinstall only prints an OpenCollective donation message
  snarkjs: true # sampritipanda/snarkjs fork; pnpm matches the build by name
  snarkjs@https://codeload.github.com/sampritipanda/snarkjs/tar.gz/fef81fc51d17a734637555c6edbd585ecda02d9e: true # explicit tarball-key form of the fork above
  unrs-resolver: true # native resolver postinstall

# circom_tester is overridden to a github: ref (see overrides below); pnpm 11's
# default block on exotic subdeps rejects it. Re-enable once MT-21/MT-22 migrate
# circom_tester to a registry release and the github: override is removed.
blockExoticSubdeps: false

patchedDependencies:
  react-native-svg@15.14.0: pnpm-patches/react-native-svg@15.14.0.patch
  '@turnkey/core@1.7.0': pnpm-patches/@turnkey__core@1.7.0.patch
  react-native-date-picker@5.0.13: pnpm-patches/react-native-date-picker@5.0.13.patch
  react-native-keychain@10.0.0: pnpm-patches/react-native-keychain@10.0.0.patch
  react-native-passport-reader@1.0.3: pnpm-patches/react-native-passport-reader@1.0.3.patch
  '@segment/analytics-react-native@2.23.0': pnpm-patches/@segment__analytics-react-native@2.23.0.patch

# Pin jsdom to v25 across the workspace. jsdom v26+ uses cssstyle v5, which
# turns CSSStyleDeclaration into a strict Proxy that rejects react-dom v18's
# numeric-index style writes (TypeError: 'set' on proxy: trap returned falsish).
overrides:
  # circom-dl depends on npm circom_tester@0.0.20, but circuits tests rely on
  # the pinned remicolin fork's getOutput(witness, string[]) API. Force every
  # hoisted copy to the same implementation until MT-22 migrates to upstream.
  circom_tester: github:remicolin/circom_tester#81e963cea5fb91ca31126058c8fdc9aafc9d695d
  jsdom: ^25.0.1
  # Pin @types/minimatch to v5; v6 is a deprecated stub with no .d.ts files,
  # which makes TS error "TS2688: Cannot find type definition file for 'minimatch'"
  # whenever the @types directory gets scanned (e.g. ng-packagr in sdk/qrcode-angular).
  '@types/minimatch': 5.1.2
  # Pin prettier to one version across the workspace. Mixed ^3.5.3/^3.8.3 ranges
  # plus contracts' exact 3.5.3, under nodeLinker: hoisted, let CI and local
  # resolve different prettier builds, which reformat .sol/.md differently →
  # recurring format-check drift. prettier-plugin-solidity@2.3.1 peer is >=3.0.0,
  # so 3.8.3 is safe.
  prettier: 3.8.3
  # typechain@8 calls prettier.format() synchronously for codegen, but prettier 3
  # made format() async (returns a Promise). Under the global pin above, typechain
  # writes that Promise to disk and crashes with "The data argument ... Received an
  # instance of Promise". Keep typechain on prettier 2.x, which has a sync format().
  typechain>prettier: 2.8.8
  # @zk-email/relayer-utils@0.3.7 pulls node-pre-gyp-github from the ultamatt git
  # tarball (an exotic subdep that blockExoticSubdeps rejects). The tarball only
  # pins v1.4.3 of a publish-time tool (uploads prebuilt binaries to GitHub
  # releases; not used when consuming relayer-utils), so resolve it from the
  # registry instead. This removes the last blockExoticSubdeps blocker (MT-9).
  node-pre-gyp-github: 1.4.4
  # Ported from yarn `resolutions` during the pnpm migration. Without these,
  # pnpm allows multiple versions of these packages to co-exist (yarn dedupes
  # them via `resolutions`), which inflates Metro's bundle ~3x by bundling
  # duplicate React/RN copies from the .pnpm virtual store.
  '@babel/core': ^7.28.6
  '@babel/runtime': ^7.28.6
  '@noble/curves': 1.9.7
  '@noble/hashes': 1.8.0
  '@swc/core': 1.7.36
  '@tamagui/animations-react-native': 1.144.4
  '@tamagui/toast': 1.144.4
  '@types/node': ^22.18.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  ethereum-cryptography: 3.2.0
  punycode: npm:punycode.js@^2.3.1
  react: ^19.2.0
  react-dom: ^19.2.0
  react-native: 0.83.9
  react-native-passkey: ^3.3.3
  react-native-blur-effect: 1.1.3
  react-native-webview: 13.16.0

# @selfxyz/euclid lists react-native-blur-effect as a peer, but it is only
# required by consumers that opt into blur effects. Mark it optional so
# workspaces that do not install it (e.g. mobile-sdk-demo) don't warn.
packageExtensions:
  '@selfxyz/euclid@*':
    peerDependenciesMeta:
      react-native-blur-effect:
        optional: true
